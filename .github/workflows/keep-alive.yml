name: Keep Supabase Awake

on:
  schedule:
    # Runs 3 times a day (at 00:00, 08:00, and 16:00 UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          # Pings your API URL stored securely in your GitHub Secrets
          curl -I -s "${{ secrets.API_URL }}/categories" || echo "Ping attempted"
